# 編排核心：publisher / backend / frontend 共用 bridge network。
# 變數名稱與 .env.example 鎖定。複製 .env.example 為 .env 可覆寫。

services:
  publisher:
    build:
      context: ./ros2_ws
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      GPS_CSV_PATH: ${GPS_CSV_PATH:-/data/path_data.csv}
      PUBLISH_RATE_HZ: ${PUBLISH_RATE_HZ:-5}
    volumes:
      - ./data:/data:ro
    networks:
      - ros2

  backend:
    build:
      context: ./backend
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ros2

  frontend:
    build:
      context: ./frontend
      args:
        VITE_WS_URL: ${VITE_WS_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ros2

networks:
  ros2:
    driver: bridge
